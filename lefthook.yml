#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
pre-commit:
  commands:
    lint:
      run: npm run lint:fix {staged_files}
      stage_fixed: true
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}"

    format:
      # --no-error-on-unmatched-pattern: arquivos que o oxfmt ignora por padrão (ex.: package-lock.json)
      # não devem travar o commit com "Expected at least one target file".
      run: npm run fmt -- --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
      glob: "*.{md,yml,yaml,toml,json,js,mjs,cjs,ts,mts,cts,jsx,tsx}"
      exclude:
        - "package-lock.json"
